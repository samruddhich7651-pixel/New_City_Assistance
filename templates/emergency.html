
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Assistance | NewCity</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="emergency-page">
    <main class="emergency-container">

        <header class="emergency-header">
            <h2>Emergency Assistance</h2>
            <p>We are here to help you in emergencies.</p>
        </header>

        <section class="emergency-services">

            <a href="javascript:void(0)" class="emergency-service-card"
               onclick="findNearbyEmergency('hospital')">
                <div class="emergency-icon hospital-icon">
                    <i class="fas fa-house-medical"></i>
                </div>
                <h3>Hospital</h3>
                <p>Find Nearby Hospitals</p>
            </a>

            <a href="tel:108" class="emergency-service-card"
               onclick="handleEmergencyCall(event, '108', 'Ambulance')">
                <div class="emergency-icon ambulance-icon">
                    <i class="fas fa-truck-medical"></i>
                </div>
                <h3>Ambulance</h3>
                <p>108 / Emergency</p>
            </a>

            <a href="tel:100" class="emergency-service-card"
               onclick="handleEmergencyCall(event, '100', 'Police')">
                <div class="emergency-icon police-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h3>Police</h3>
                <p>100</p>
            </a>

            <a href="tel:101" class="emergency-service-card"
               onclick="handleEmergencyCall(event, '101', 'Fire Station')">
                <div class="emergency-icon fire-icon">
                    <i class="fas fa-fire-extinguisher"></i>
                </div>
                <h3>Fire Station</h3>
                <p>101</p>
            </a>

            <a href="javascript:void(0)" class="emergency-service-card"
               onclick="findNearbyEmergency('pharmacy')">
                <div class="emergency-icon pharmacy-icon">
                    <i class="fas fa-kit-medical"></i>
                </div>
                <h3>Pharmacy</h3>
                <p>Find Nearby Pharmacy</p>
            </a>

            <a href="tel:181" class="emergency-service-card"
               onclick="handleEmergencyCall(event, '181', 'Women Helpline')">
                <div class="emergency-icon women-icon">
                    <i class="fas fa-person-dress"></i>
                </div>
                <h3>Women Helpline</h3>
                <p>181</p>
            </a>

        </section>

        <button type="button" class="emergency-sos-btn"
                onclick="handleEmergencyCall(event, '112', 'Emergency SOS')">
            <span>
                <i class="fas fa-star-of-life"></i>
                Emergency SOS
            </span>
            <small>Tap to call emergency number 112</small>
        </button>

    </main>
</div>

<script>
function handleEmergencyCall(event, number, serviceName) {
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isMobile) {
        return;
    }

    event.preventDefault();

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(number)
            .then(function () {
                alert(serviceName + " number " + number + " copied successfully. You can dial it from your phone.");
            })
            .catch(function () {
                alert(serviceName + " Emergency Number: " + number);
            });
    } else {
        alert(serviceName + " Emergency Number: " + number);
    }
}
</script>

<script src="{{ url_for('static', filename='js/script.js') }}?v=10"></script>
</body>
</html>
