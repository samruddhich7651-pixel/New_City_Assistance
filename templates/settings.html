
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | NewCity</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="profile-page">
    <main class="profile-content">

        <div class="address-page-header">
            <a href="{{ url_for('profile') }}" class="address-back">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h2>Settings</h2>
                <p>Manage your account preferences</p>
            </div>
        </div>

        <div class="settings-intro">
            <div class="settings-intro-icon">
                <i class="fas fa-sliders"></i>
            </div>
            <div>
                <h3>Account Settings</h3>
                <p>Customize your CityAssist experience.</p>
            </div>
        </div>

        <section class="profile-menu settings-menu">

            <a href="{{ url_for('notification_preferences') }}" class="profile-menu-item">
                <span>
                    <i class="fas fa-bell"></i>
                    <span class="settings-item-text">
                        <strong>Notification Preferences</strong>
                        <small>Manage your notification settings</small>
                    </span>
                </span>
                <i class="fas fa-chevron-right"></i>
            </a>

            <a href="{{ url_for('change_password') }}" class="profile-menu-item">
                <span>
                    <i class="fas fa-lock"></i>
                    <span class="settings-item-text">
                        <strong>Change Password</strong>
                        <small>Update your account password</small>
                    </span>
                </span>
                <i class="fas fa-chevron-right"></i>
            </a>

            <a href="{{ url_for('logout') }}" class="profile-menu-item logout-item">
                <span>
                    <i class="fas fa-right-from-bracket"></i>
                    <span class="settings-item-text">
                        <strong>Logout</strong>
                        <small>Sign out from your account</small>
                    </span>
                </span>
                <i class="fas fa-chevron-right"></i>
            </a>

        </section>

    </main>

    <nav class="profile-bottom-nav">
        <a href="/" class="profile-nav-item">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>
        <a href="/explore" class="profile-nav-item">
            <i class="fas fa-search"></i>
            <span>Explore</span>
        </a>
        <a href="/ai-assistant" class="profile-nav-item">
            <i class="fas fa-robot"></i>
            <span>AI Assistant</span>
        </a>
        <a href="/favourites" class="profile-nav-item">
            <i class="fas fa-heart"></i>
            <span>Favourites</span>
        </a>
        <a href="/profile" class="profile-nav-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
