
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | NewCity</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="profile-page">
    <main class="profile-content">

        <div class="address-page-header">
            <a href="{{ url_for('settings') }}" class="address-back">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h2>Change Password</h2>
                <p>Keep your account secure</p>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="flash-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <section class="profile-menu">
            <form method="POST" class="profile-edit-form">

                <label>Current Password</label>
                <input type="password" name="current_password"
                       placeholder="Enter current password" required>

                <label>New Password</label>
                <input type="password" name="new_password"
                       placeholder="Minimum 8 characters" minlength="8" required>

                <label>Confirm New Password</label>
                <input type="password" name="confirm_password"
                       placeholder="Re-enter new password" minlength="8" required>

                <button type="submit">
                    <i class="fas fa-lock"></i> Update Password
                </button>

            </form>
        </section>

    </main>

    <nav class="profile-bottom-nav">
        <a href="/" class="profile-nav-item">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>
        <a href="/explore" class="profile-nav-item">
            <i class="fas fa-search"></i>
            <span>Explore</span>
        </a>
        <a href="/ai-assistant" class="profile-nav-item">
            <i class="fas fa-robot"></i>
            <span>AI Assistant</span>
        </a>
        <a href="/favourites" class="profile-nav-item">
            <i class="fas fa-heart"></i>
            <span>Favourites</span>
        </a>
        <a href="/profile" class="profile-nav-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
