
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Admin Password | NewCity</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .password-wrap{max-width:600px;margin:30px auto}
        .password-card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 18px #1725540d}
        .password-card label{display:block;margin:16px 0 7px;font-weight:600}
        .password-card input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}
        .password-card button{margin-top:20px;padding:12px 18px;background:#1d4ed8;color:white;border:0;border-radius:7px;font-weight:600;cursor:pointer}
        .password-flash{padding:10px;background:#eff6ff;color:#1d4ed8;border-radius:7px;margin-bottom:12px}
    </style>
</head>
<body class="admin-page">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a href="/" class="admin-brand"><span>🌐</span><div><strong>NewCity</strong><small>ADMIN PANEL</small></div></a>
        <nav class="admin-navigation">
            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-link">▦ Dashboard</a>
            <a href="{{ url_for('admin_settings') }}" class="admin-nav-link active">⚙ Settings</a>
            <a href="{{ url_for('admin_logout') }}" class="admin-nav-link admin-logout">↪ Logout</a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div><p>NEWCITY ADMIN PANEL</p><h1>Change Password</h1></div>
        </header>

        <div class="password-wrap">
            <div class="password-card">
                <h2>Update Admin Password</h2>
                <p>Choose a strong password with at least 8 characters.</p>

                {% with messages = get_flashed_messages() %}
                    {% for message in messages %}<div class="password-flash">{{ message }}</div>{% endfor %}
                {% endwith %}

                <form method="POST">
                    <label>Current Password</label>
                    <input type="password" name="current_password" required>

                    <label>New Password</label>
                    <input type="password" name="new_password" minlength="8" required>

                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" minlength="8" required>

                    <button type="submit">Update Password</button>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
